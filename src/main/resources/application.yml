server:
  port: 8080

spring:
  application:
    name: event-booking-service

  datasource:
    url: jdbc:postgresql://localhost:5432/eventdb
    username: event_user
    password: event_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  cache:
    type: redis

  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    root: INFO
    org.springframework.security: INFO
